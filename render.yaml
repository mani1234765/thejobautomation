# JobPilot staging on Render (Blueprint). NOT deployed — applying this creates billable resources and
# requires the owner's explicit approval. See DEPLOYMENT.md §Staging for the procedure.
#
# Topology: public web (Next.js) → private API (FastAPI, not internet-reachable) → Postgres + Key Value.
# The API is private, so trusting exactly one X-Forwarded-For hop (Render's proxy) is safe; the Next.js
# rewrite passes the header through unchanged (measured).

envVarGroups:
  - name: jobpilot-shared
    envVars:
      - key: JOBPILOT_ENV
        value: production            # staging runs with production guards on
      - key: JOBPILOT_COOKIE_SECURE
        value: "true"
      - key: JOBPILOT_TRUSTED_PROXY_HOPS
        value: "1"
      - key: JOBPILOT_SECRET_KEY
        generateValue: true          # base64-encoded 256-bit value
      - key: JOBPILOT_ENCRYPTION_KEY
        sync: false                  # must be a Fernet key — generate locally, paste in the Dashboard
      - key: JOBPILOT_PUBLIC_APP_URL
        sync: false                  # https://<web service host or custom domain>
      - key: JOBPILOT_LLM_PROVIDER
        sync: false
      - key: JOBPILOT_LLM_MODEL
        sync: false
      - key: JOBPILOT_LLM_API_KEY
        sync: false
      - key: JOBPILOT_GOOGLE_CLIENT_ID
        sync: false
      - key: JOBPILOT_GOOGLE_CLIENT_SECRET
        sync: false
      - key: JOBPILOT_WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: JOBPILOT_WHATSAPP_PHONE_NUMBER_ID
        sync: false

databases:
  - name: jobpilot-db
    postgresMajorVersion: "17"
    region: singapore
    ipAllowList: []                  # private network only

services:
  - type: keyvalue
    name: jobpilot-kv
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction      # never evict rate-limit windows under memory pressure
    ipAllowList: []                  # private network only

  - type: pserv
    name: jobpilot-api
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    preDeployCommand: alembic upgrade head
    disk:                            # single instance; brief downtime on each deploy (Render disk constraint)
      name: resumes
      mountPath: /app/storage
      sizeGB: 5
    envVars:
      - fromGroup: jobpilot-shared
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: JOBPILOT_REDIS_HOST
        fromService:
          type: keyvalue
          name: jobpilot-kv
          property: host
      - key: JOBPILOT_REDIS_PORT
        fromService:
          type: keyvalue
          name: jobpilot-kv
          property: port

  - type: worker
    name: jobpilot-worker
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker.main
    envVars:
      - fromGroup: jobpilot-shared
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: JOBPILOT_REDIS_HOST
        fromService:
          type: keyvalue
          name: jobpilot-kv
          property: host
      - key: JOBPILOT_REDIS_PORT
        fromService:
          type: keyvalue
          name: jobpilot-kv
          property: port

  - type: web
    name: jobpilot-web
    runtime: node
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JOBPILOT_API_HOST
        fromService:
          type: pserv
          name: jobpilot-api
          property: host
      - key: JOBPILOT_API_PORT
        value: "10000"
